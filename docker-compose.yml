# =============================================================
# Entorno de desarrollo LOCAL (no usar en producción).
# Variables opcionales (archivo .env junto a este compose o entorno):
#   MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD,
#   APP_KEY, PAYMENT_WEBHOOK_SECRET
# Nota: el entrypoint del backend reescribe hotel-backend/.env con
# estos valores al arrancar el contenedor.
# =============================================================
services:
  # -------------------------------------------------------------
  # Base de Datos MySQL 8
  # -------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: grand_ledger_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_reservas}
      MYSQL_USER: ${MYSQL_USER:-hotel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # $$ escapa la interpolación de compose: las variables se resuelven dentro del contenedor
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - grand-ledger-network

  # -------------------------------------------------------------
  # Backend API - Laravel 11 & PHP 8.2
  # -------------------------------------------------------------
  backend:
    build:
      context: ./hotel-backend
      dockerfile: Dockerfile
    container_name: grand_ledger_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./hotel-backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      LOG_CHANNEL: stack
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-hotel_reservas}
      DB_USERNAME: ${MYSQL_USER:-hotel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hotel_local}
      MAIL_MAILER: log
      BROADCAST_CONNECTION: log
      PAYMENT_GATEWAY: simulation
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-secret}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-password123}
      SEED_RECEPCION_PASSWORD: ${SEED_RECEPCION_PASSWORD:-password123}
      # Cola y planificador (SHE-038): el entrypoint lanza en segundo plano
      # `queue:work` y `schedule:work` con reinicio automático. Ponga "false"
      # para desactivarlos (p. ej. al depurar con `php artisan queue:listen`).
      QUEUE_CONNECTION: database
      RUN_QUEUE_WORKER: "true"
      RUN_SCHEDULER: "true"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - grand-ledger-network

  # -------------------------------------------------------------
  # Frontend SPA - React & Vite
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./hotel-frontend
      dockerfile: Dockerfile
    container_name: grand_ledger_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./hotel-frontend:/app
      # Volumen anónimo para preservar node_modules compilados dentro del contenedor
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # Detección confiable de cambios de archivos en caliente (HMR) para Windows
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    networks:
      - grand-ledger-network

# -------------------------------------------------------------
# Volúmenes y Redes persistentes
# -------------------------------------------------------------
volumes:
  db_data:
    driver: local

networks:
  grand-ledger-network:
    driver: bridge
